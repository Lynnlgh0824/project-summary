<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>恢复数据</title>
</head>
<body style="padding: 20px; font-family: -apple-system, sans-serif;">
    <h1>🔧 项目日志系统恢复工具</h1>
    <button onclick="recoverData()" style="padding: 15px 30px; font-size: 16px; background: #52c41a; color: white; border: none; border-radius: 8px; cursor: pointer;">🔄 恢复数据</button>
    <pre id="result" style="margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px;"></pre>
    
    <script>
        function recoverData() {
            const result = document.getElementById('result');
            let output = '';
            
            output += '=== 开始恢复 ===\n\n';
            
            // 读取默认项目数据
            const defaultProjects = [
                { id: 'project-organization', name: '🗂️ 项目管理汇总', startDate: '2026-02-06' },
                { id: 'english-learning-tts', name: '🎧 英语朗读学习', startDate: '2026-02-05' },
                { id: 'chiang-mai-activities', name: '🏝️ 清迈活动平台', startDate: '2026-01-19' },
                { id: 'aisaas-video', name: '🎥 AI SaaS 视频', startDate: '2026-01-22' },
                { id: 'clawdbot-railway', name: '🤖 Clawdbot', startDate: '2026-01-15' },
                { id: 'skills-development', name: '⚡ 技能开发与学习', startDate: '2026-01-01' }
            ];
            
            // 恢复项目列表
            localStorage.setItem('project_list', JSON.stringify(defaultProjects));
            output += '✅ 已恢复项目列表 (6 个项目)\n';
            
            // 检查日志
            const logs = localStorage.getItem('project_logs');
            if (!logs) {
                localStorage.setItem('project_logs', '[]');
                output += '✅ 已初始化日志（空）\n';
            } else {
                output += `✅ 日志已存在 (${JSON.parse(logs).length} 条)\n`;
            }
            
            // 检查待办
            const todos = localStorage.getItem('project_todos');
            if (!todos) {
                localStorage.setItem('project_todos', '{}');
                output += '✅ 已初始化待办（空）\n';
            } else {
                const todoCount = Object.values(JSON.parse(todos)).reduce((sum, arr) => sum + arr.length, 0);
                output += `✅ 待办已存在 (${todoCount} 个)\n`;
            }
            
            output += '\n=== 恢复完成 ===\n';
            output += '\n请刷新主页面查看。\n';
            
            result.textContent = output;
            
            // 3秒后自动打开主页面
            setTimeout(() => {
                if (confirm('数据已恢复！是否打开主页面？')) {
                    window.location.href = 'file:///Users/yuzhoudeshengyin/Documents/my_project/project-summary/项目日志系统.html';
                }
            }, 1000);
        }
    </script>
</body>
</html>
